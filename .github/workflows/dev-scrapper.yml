

name: Push Files Indexer Woice Scrapper Dev Branch on AWS ECR and Deploy to AWS Lambda

on:
  push:
    branches: [ "dev-scrapper" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: woice-kb
  LAMBDA_FUNCTION: devScrapper
  IMAGE_TAG: devScrapper

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Dev of WoiceAI's Scrapper
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    - name: Create .env file
      run: |
        cd scrapper
        echo "${{ secrets.WOICEAI_SCRAPPER }}" > .env

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd scrapper
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to Lambda
      id: deploy-image-lambda
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        aws lambda update-function-code --function-name $LAMBDA_FUNCTION --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG